<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="探索 ITIGRE 旅行、音樂、棒球與日常文章中的 hashtag，跨越典藏與新文章尋找同一個主題。"><title>Hashtag 關聯索引・ITIGRE</title><link id="itigre-media-frame-css" rel="stylesheet" href="/styles/media-frame.css"><link id="itigre-photo-layout-css" rel="stylesheet" href="/styles/photo-layout.css"><script id="itigre-photo-layout-js" defer src="/scripts/photo-layout.js"></script><link rel="canonical" href="https://itigre.com/hashtags/"></head><body><main><nav><a href="/">ITIGRE 首頁</a><a href="/knowledge/">知識索引</a><a href="/reading-guide/">閱讀指南</a></nav><header><p class="kicker">ITIGRE / LINKED KNOWLEDGE</p><h1>#標籤・文章關聯</h1><p>同一個關鍵字，把過去的日記、旅途、演唱會與後來補寫的故事接在一起。原文不被自動改寫，這裡只是替它們找到新的閱讀路徑。</p></header><form id="tag-search" role="search"><label for="tag-query">搜尋主題關鍵字</label><div class="search-row"><input id="tag-query" type="search" placeholder="例如 三商虎、東京、M2M" autocomplete="off"><button type="submit">搜尋</button></div></form><section aria-labelledby="tag-heading"><h2 id="tag-heading">熱門標籤</h2><div class="tag-cloud" id="tag-cloud"><p class="muted" id="tags-loading">正在讀取已公開文章的標籤…</p></div></section><section id="results" aria-live="polite"><h2 id="results-heading">選擇標籤，查看關聯文章</h2><p class="muted" id="results-description">支援原始文章標籤和內文 #hashtag，文章的歷史刊登日期保持不變。</p><ol id="results-list"></ol></section></main><script>
(() => {
  const form=document.getElementById('tag-search'),field=document.getElementById('tag-query');
  const cloud=document.getElementById('tag-cloud'),heading=document.getElementById('tag-heading');
  const title=document.getElementById('results-heading'),desc=document.getElementById('results-description');
  const list=document.getElementById('results-list');
  const norm=s=>String(s??'').normalize('NFKC').replace(/^#+/u,'').trim().toLowerCase();
  let cached;
  async function load(){
    if(cached)return cached;
    const response=await fetch('/data/hashtag-index.json');
    if(!response.ok)throw new Error('Index unavailable');
    cached=await response.json();
    return cached;
  }
  function link(tag){
    const a=document.createElement('a');a.href='/hashtags/?tag='+encodeURIComponent(tag.key);
    a.className='tag';a.textContent='#'+tag.label;
    const count=document.createElement('small');count.textContent=String(tag.count);a.append(count);return a;
  }
  function renderTag(group){
    title.textContent='#'+group.label+' 的關聯文章';
    desc.textContent='共有 '+group.count+' 篇文章。標籤相同不代表內容事實完全相同。';
    list.replaceChildren();
    for(const post of group.posts){
      const li=document.createElement('li'),a=document.createElement('a'),date=document.createElement('time');
      a.href=post.href;a.textContent=post.title;date.textContent=post.date;date.dateTime=post.date;
      li.append(a,date);list.append(li);
    }
  }
  async function select(value){
    const query=norm(value);if(!query)return;
    title.textContent='正在找出關聯文章…';
    try{
      const groups=(await load()).groups;
      const exact=groups.find(g=>g.key===query),matches=groups.filter(g=>g.key.includes(query)).slice(0,80);
      cloud.replaceChildren(...matches.map(link));heading.textContent=matches.length+' 個相近的標籤';
      if(exact)renderTag(exact);else{title.textContent='找不到完全符合的標籤';desc.textContent='請從上方相近標籤挑選。';list.replaceChildren();}
      field.value=value;
    }catch(error){title.textContent='索引載入失敗';desc.textContent='請稍後再試，或返回知識索引。';list.replaceChildren();}
  }
  form.addEventListener('submit',e=>{e.preventDefault();const key=norm(field.value);if(!key)return;history.replaceState(null,'','/hashtags/?tag='+encodeURIComponent(key));select(key);});
  const initial=new URLSearchParams(location.search).get('tag');
  if(initial)select(initial);
  else load().then(data=>{cloud.replaceChildren(...data.groups.slice(0,48).map(link));}).catch(()=>{cloud.textContent='標籤索引目前無法載入';});
})();
</script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:#2e2925;font:1rem/1.8 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:900px;margin:auto;padding:clamp(1rem,4vw,2.5rem)}nav{display:flex;flex-wrap:wrap;gap:1rem}a{color:#843c1b;text-underline-offset:.2em}header{margin:2rem 0 1.5rem}.kicker{font-size:.78rem;letter-spacing:.16em;color:#98623f}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(2rem,6vw,3.2rem);line-height:1.3;margin:.4rem 0}h2{font-size:1.25rem}
#tag-search,section{padding:clamp(1rem,4vw,2rem);background:#fffdf8;border:1px solid #e3d7cc;margin:1.2rem 0;border-radius:1rem}label{display:block;font-weight:650;margin-bottom:.4rem}
.search-row{display:flex;gap:.5rem}.search-row input{min-width:0;flex:1;padding:.7rem .8rem;border:1px solid #b4a99f;border-radius:.6rem;font-size:1rem}.search-row button{background:#7e3c1e;color:#fff;border:0;border-radius:.6rem;padding:.6rem 1rem;font-size:1rem;cursor:pointer}
.tag-cloud{display:flex;flex-wrap:wrap;gap:.55rem}.tag{display:inline-flex;gap:.4rem;align-items:center;padding:.3rem .65rem;background:#f6ede4;border:1px solid #dbc4b3;border-radius:2rem;text-decoration:none;max-width:100%;overflow-wrap:anywhere}.tag small{color:#716153}ol{padding-left:1.3rem}li{padding:.65rem 0;border-bottom:1px dashed #dfd4c7}li a{font-weight:650}li time{font-size:.85rem;color:#706b66;margin-left:.8rem}.muted{color:#716a65}@media(max-width:480px){.search-row button{padding-inline:.75rem}li time{display:block;margin:0}}
</style></body></html>

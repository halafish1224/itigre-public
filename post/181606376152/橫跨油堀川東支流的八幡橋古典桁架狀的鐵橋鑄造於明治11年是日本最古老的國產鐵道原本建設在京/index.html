zogzi><a href="../../../" data-astro-cid-5gfzogzi>ITIGRE · 文章典藏</a></header><article data-astro-cid-5gfzogzi><h1 data-astro-cid-5gfzogzi>橫跨油堀川東支流的八幡橋，古典桁架狀的鐵橋，鑄造於明治11年...</h1><time datetime="2019-01-01" data-astro-cid-5gfzogzi>2019-01-01</time><div class="body" data-astro-cid-5gfzogzi>橫跨油堀川東支流的八幡橋，古典桁架狀的鐵橋，鑄造於明治11年，是「日本最古老的國產鐵道」。原本建設在京橋的楓川上（稱彈正橋），昭和4年移置此處。現在下方成了散佈到，也可以穿過橋下。
富岡八幡宮林木茂密，散步許多可看之處，即使對神社佛寺不感興趣的人都能樂在其中。深川富岡八幡宮前深的元八幡（富賀岡八幡宮）是永井荷風喜愛的低調景點。</div></article><footer class="it-reading-end" data-astro-cid-5gfzogzi><a href="#article-top" data-astro-cid-5gfzogzi>回到頁首</a> · <a href="../../../reading-guide/" data-astro-cid-5gfzogzi>找下一篇文章</a> · <a href="/hashtags/" data-astro-cid-5gfzogzi>#知識關聯</a> · <a href="/admin/#/collections/legacy_edits/new?_slug=181606376152&amp;title=%E6%A9%AB%E8%B7%A8%E6%B2%B9%E5%A0%80%E5%B7%9D%E6%9D%B1%E6%94%AF%E6%B5%81%E7%9A%84%E5%85%AB%E5%B9%A1%E6%A9%8B%EF%BC%8C%E5%8F%A4%E5%85%B8%E6%A1%81%E6%9E%B6%E7%8B%80%E7%9A%84%E9%90%B5%E6%A9%8B%EF%BC%8C%E9%91%84%E9%80%A0%E6%96%BC%E6%98%8E%E6%B2%BB11%E5%B9%B4...&amp;original_path=post%2F181606376152%2F%E6%A9%AB%E8%B7%A8%E6%B2%B9%E5%A0%80%E5%B7%9D%E6%9D%B1%E6%94%AF%E6%B5%81%E7%9A%84%E5%85%AB%E5%B9%A1%E6%A9%8B%E5%8F%A4%E5%85%B8%E6%A1%81%E6%9E%B6%E7%8B%80%E7%9A%84%E9%90%B5%E6%A9%8B%E9%91%84%E9%80%A0%E6%96%BC%E6%98%8E%E6%B2%BB11%E5%B9%B4%E6%98%AF%E6%97%A5%E6%9C%AC%E6%9C%80%E5%8F%A4%E8%80%81%E7%9A%84%E5%9C%8B%E7%94%A2%E9%90%B5%E9%81%93%E5%8E%9F%E6%9C%AC%E5%BB%BA%E8%A8%AD%E5%9C%A8%E4%BA%AC&amp;original_date=2019-01-01&amp;edit_status=draft&amp;body=%E6%A9%AB%E8%B7%A8%E6%B2%B9%E5%A0%80%E5%B7%9D%E6%9D%B1%E6%94%AF%E6%B5%81%E7%9A%84%E5%85%AB%E5%B9%A1%E6%A9%8B%EF%BC%8C%E5%8F%A4%E5%85%B8%E6%A1%81%E6%9E%B6%E7%8B%80%E7%9A%84%E9%90%B5%E6%A9%8B%EF%BC%8C%E9%91%84%E9%80%A0%E6%96%BC%E6%98%8E%E6%B2%BB11%E5%B9%B4%EF%BC%8C%E6%98%AF%E3%80%8C%E6%97%A5%E6%9C%AC%E6%9C%80%E5%8F%A4%E8%80%81%E7%9A%84%E5%9C%8B%E7%94%A2%E9%90%B5%E9%81%93%E3%80%8D%E3%80%82%E5%8E%9F%E6%9C%AC%E5%BB%BA%E8%A8%AD%E5%9C%A8%E4%BA%AC%E6%A9%8B%E7%9A%84%E6%A5%93%E5%B7%9D%E4%B8%8A%EF%BC%88%E7%A8%B1%E5%BD%88%E6%AD%A3%E6%A9%8B%EF%BC%89%EF%BC%8C%E6%98%AD%E5%92%8C4%E5%B9%B4%E7%A7%BB%E7%BD%AE%E6%AD%A4%E8%99%95%E3%80%82%E7%8F%BE%E5%9C%A8%E4%B8%8B%E6%96%B9%E6%88%90%E4%BA%86%E6%95%A3%E4%BD%88%E5%88%B0%EF%BC%8C%E4%B9%9F%E5%8F%AF%E4%BB%A5%E7%A9%BF%E9%81%8E%E6%A9%8B%E4%B8%8B%E3%80%82%0A%E5%AF%8C%E5%B2%A1%E5%85%AB%E5%B9%A1%E5%AE%AE%E6%9E%97%E6

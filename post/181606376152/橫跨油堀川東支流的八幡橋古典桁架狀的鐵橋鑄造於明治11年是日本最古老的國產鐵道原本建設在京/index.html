富岡八幡宮林木茂密，散步許多可看之處，即使對神社佛寺不感興趣的人都能樂在其中。深川富岡八幡宮前深的元八幡（富賀岡八幡宮）是永井荷風喜愛的低調景點。</div></article><footer class="it-reading-end" data-astro-cid-5gfzogzi><a href="#article-top" data-astro-cid-5gfzogzi>回到頁首</a> · <a href="../../../reading-guide/" data-astro-cid-5gfzogzi>找下一篇文章</a></footer></main></body></html>

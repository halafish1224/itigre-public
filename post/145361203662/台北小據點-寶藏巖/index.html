不失是一個不錯的景點 可以發展韓屋觀光模式
裡頭的店比較高神秘感 好像老外比較敢踏進去～
（就像我們到國外很敢走一樣）
藝術家展覽的地方也超ＦＲＥＥ
體感像是有韓國韓屋跟小小小小三清洞附近的小貫樓梯的味道（因為真的很不夠多）
我覺得這是不輸九份的地方！ （交通、停車、吃又離公館近）
兩個月的駐台藝術家
回校園一看? 真是夠安靜的！！
有種好莫名的感覺！
沈澱、沈澱

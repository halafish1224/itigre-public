</style></head><body data-astro-cid-5gfzogzi><main data-astro-cid-5gfzogzi><header data-astro-cid-5gfzogzi>ITIGRE · 文章典藏</header><article data-astro-cid-5gfzogzi><h1 data-astro-cid-5gfzogzi>我是穩若千斤的石頭，無懼炙熱的焰火對我燃燒。我是堅硬穩固的石...</h1><time datetime="2022-10-30" data-astro-cid-5gfzogzi>2022-10-30</time><div class="body" data-astro-cid-5gfzogzi>我是穩若千斤的石頭，無懼炙熱的焰火對我燃燒。我是堅硬穩固的石頭，無畏猛烈敲打撞擊著我。我會在無盡的黑暗中獨自閃耀。
萬物終將化為塵土消逝，我不會粉碎、不會化為灰燼，我是不受自然法則支配的石頭，我從自然法則裡存活下來。
我是，我是 鑽石。

不是因為它不重要，而是它本來就只是經過。
曾經以為，只要努力，就能留住一些什麼。
但後來發現，有些感情、有些人、有些瞬間，
就像夜裡路燈下的一道閃電──
你看見了、記住了，但它不會為你停留。
坐在咖啡廳座椅上，看著窗外的雨一滴滴落下，
有點惆悵，只是更那麼懂了，
那些以為的永恆，其實都只是剛好來到過的片刻。</div><footer aria-label="原有標籤" data-astro-cid-5gfzogzi><p data-astro-cid-5gfzogzi><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#如露亦如電</span><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#life</span></p></footer></article><footer class="it-reading-end" data-astro-cid-5gfzogzi><a href="#article-top" data-astro-cid-5gfzogzi>回到頁首</a> · <a href="../../../reading-guide/" data-astro-cid-5gfzogzi>找下一篇文章</a></footer></main></body></html>

t:9px;margin:-7px 0 0;text-align:right;line-height:1;pointer-events:none}.itigre-page-counter{display:inline-flex;align-items:center;justify-content:flex-end;min-height:0!important;height:9px;padding:0 .12rem;font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;color:inherit;opacity:.72;white-space:nowrap}.itigre-page-counter .counterapi,.itigre-page-counter .counterapi *{display:inline!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:inherit!important;font:inherit!important;line-height:1!important;letter-spacing:inherit!important;text-decoration:none!important}</style><link rel="canonical" href="https://itigre.com/post/790773891611131904/%E6%9C%89%E4%BA%9B%E4%BA%8B%E4%B8%80%E9%96%8B%E5%A7%8B%E5%B0%B1%E8%A8%BB%E5%AE%9A%E6%9C%83%E6%B6%88%E5%A4%B1-%E4%B8%8D%E6%98%AF%E5%9B%A0%E7%82%BA%E5%AE%83%E4%B8%8D%E9%87%8D%E8%A6%81%E8%80%8C%E6%98%AF%E5%AE%83%E6%9C%AC%E4%BE%86%E5%B0%B1%E5%8F%AA%E6%98%AF%E7%B6%93%E9%81%8E-%E6%9B%BE%E7%B6%93%E4%BB%A5%E7%82%BA%E5%8F%AA%E8%A6%81%E5%8A%AA%E5%8A%9B%E5%B0%B1%E8%83%BD%E7%95%99%E4%BD%8F%E4%B8%80/"></head><body data-astro-cid-5gfzogzi><main id="article-top" data-astro-cid-5gfzogzi><nav class="it-article-nav" aria-label="文章導覽" data-astro-cid-5gfzogzi><a href="../../../" data-astro-cid-5gfzogzi>ITIGRE 首頁</a>知識索引<a href="../../../reading-guide/" data-astro-cid-5gfzogzi>閱讀指南</a></nav><header data-astro-cid-5gfzogzi><a href="../../../" data-astro-cid-5gfzogzi>ITIGRE · 文章典藏</a></header><article data-astro-cid-5gfzogzi><h1 data-astro-cid-5gfzogzi>有些事一開始就註定會消失。</h1><time datetime="2025-08-02" data-astro-cid-5gfzogzi>2025-08-02</time><div class="body" data-astro-cid-5gfzogzi>有些事一開始就註定會消失。
不是因為它不重要，而是它本來就只是經過。
曾經以為，只要努力，就能留住一些什麼。
但後來發現，有些感情、有些人、有些瞬間，
就像夜裡路燈下的一道閃電──
你看見了、記住了，但它不會為你停留。
坐在咖啡廳座椅上，看著窗外的雨一滴滴落下，
有點惆悵，只是更那麼懂了，
那些以為的永恆，其實都只是剛好來到過的片刻。</div><footer aria-label="原有標籤" data-astro-cid-5gfzogzi><p data-astro-cid-5gfzogzi><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#如露亦如電</span><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#life</span></p></footer></article><footer class="it-reading-end" data-astro-cid-5gfzogzi><a href="#article-top" data-astro-cid-5gfzogzi>回到頁首</a> · <a href="../../../reading-guide/" data-astro-cid-5gfzogzi>找下一篇文章</a></footer></main><script id="itigre-page-counter-init">
      (() => {
        if (window.__itigrePageCounterInitialized) return;
        window.__itigrePageCounterInitialized = true;
        const mountCounter = () => {
          if (document.querySelector('.itigre-page-counter')) return;
          const possibleLines = Array.from(document.querySelectorAll('hr, nav, header, section, article, footer, main > div'));
          const line = possibleLines.find(element => {
            if (element.tagName === 'HR') return true;
            const style = getComputedStyle(element);
            const rect = element.getBoundingClientRect();
            const hasBorder = (style.borderBottomStyle !== 'none' && parseFloat(style.borderBottomWidth) > 0)
              || (style.borderTopStyle !== 'none' && parseFloat(style.borderTopWidth) > 0);
            return hasBorder && rect.width >= 120;
          }) || document.querySelector('main') || document.body;
          if (!line || !line.parentNode) return;
          const slot = document.createElement('div');
          slot.className = 'itigre-page-counter-slot';
          const counter = document.createElement('div');
          counter.className = 'itigre-page-counter';
          counter.setAttribute('aria-label', '本頁瀏覽次數');
          const value = document.createElement('div');
          value.className = 'counterapi';
          value.setAttribute('ns', 'itigre.com');
          value.setAttribute('action', 'view');
          let pagePath = location.pathname || '/';
          try { pagePath = decodeURIComponent(pagePath); } catch (_) {}
          const segments = pagePath.split('/').filter(Boolean);
          const lastSegment = segments[segments.length - 1] || '';
          pagePath = segments.length ? '/' + segments.join('/') + (lastSegment.includes('.') ? '' : '/') : '/';
          const pageKey = pagePath === '/' ? 'home' : 'path-' + pagePath.split('/').filter(Boolean).join('--');
          value.setAttribute('key', pageKey);
          value.setAttribute('noIcon', 'true');
          value.setAttribute('noCss', 'true');
          value.setAttribute('noLink', 'true');
          value.setAttribute('noFormatting', 'true');
          counter.appendChild(value);
          const lineStyle = getComputedStyle(line);
          counter.style.color = lineStyle.color;
          slot.appendChild(counter);
          line.parentNode.insertBefore(slot, line.nextSibling);
          const library = document.createElement('script');
          library.src = 'https://counterapi.com/c.js?ns=itigre.com';
          library.async = true;
          document.head.appendChild(library);
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountCounter, { once: true });
        else mountCounter();
      })();
    </script></body></html>

</style></head><body data-astro-cid-5gfzogzi><main data-astro-cid-5gfzogzi><header data-astro-cid-5gfzogzi>ITIGRE · 文章典藏</header><article data-astro-cid-5gfzogzi><h1 data-astro-cid-5gfzogzi>有些事一開始就註定會消失。</h1><time datetime="2025-08-02" data-astro-cid-5gfzogzi>2025-08-02</time><div class="body" data-astro-cid-5gfzogzi>有些事一開始就註定會消失。
不是因為它不重要，而是它本來就只是經過。
曾經以為，只要努力，就能留住一些什麼。
但後來發現，有些感情、有些人、有些瞬間，
就像夜裡路燈下的一道閃電──
你看見了、記住了，但它不會為你停留。
坐在咖啡廳座椅上，看著窗外的雨一滴滴落下，
有點惆悵，只是更那麼懂了，
那些以為的永恆，其實都只是剛好來到過的片刻。</div></article></main></body></html>

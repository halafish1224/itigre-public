不是因為它不重要，而是它本來就只是經過。
曾經以為，只要努力，就能留住一些什麼。
但後來發現，有些感情、有些人、有些瞬間，
就像夜裡路燈下的一道閃電──
你看見了、記住了，但它不會為你停留。
坐在咖啡廳座椅上，看著窗外的雨一滴滴落下，
有點惆悵，只是更那麼懂了，
那些以為的永恆，其實都只是剛好來到過的片刻。</div><footer aria-label="原有標籤" data-astro-cid-5gfzogzi><p data-astro-cid-5gfzogzi><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#如露亦如電</span><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#life</span></p></footer></article><section class="it-hashtags" aria-label="文章 Hashtag 關聯" data-astro-cid-5gfzogzi><h2 data-astro-cid-5gfzogzi>#主題關聯</h2><div data-astro-cid-5gfzogzi><a href="/hashtags/?tag=%E5%A6%82%E9%9C%B2%E4%BA%A6%E5%A6%82%E9%9B%BB" data-astro-cid-5gfzogzi>#如露亦如電</a><a href="/hashtags/?tag=life" data-astro-cid-5gfzogzi>#life</a></div></section><footer class="it-reading-end" data-astro-cid-5gfzogzi><a href="#article-top" data-astro-cid-5gfzogzi>回到頁首</a> · <a href="../../../reading-guide/" data-astro-cid-5gfzogzi>找下一篇文章</a> · <a href="/hashtags/" data-astro-cid-5gfzogzi>#知識關聯</a> · <a href="/admin/#/collections/legacy_edits/new?_slug=790773891611131904&amp;title=%E6%9C%89%E4%BA%9B%E4%BA%8B%E4%B8%80%E9%96%8B%E5%A7%8B%E5%B0%B1%E8%A8%BB%E5%AE%9A%E6%9C%83%E6%B6%88%E5%A4%B1%E3%80%82&amp;original_path=post%2F790773891611131904%2F%E6%9C%89%E4%BA%9B%E4%BA%8B%E4%B8%80%E9%96%8B%E5%A7%8B%E5%B0%B1%E8%A8%BB%E5%AE%9A%E6%9C%83%E6%B6%88%E5%A4%B1-%E4%B8%8D%E6%98%AF%E5%9B%A0%E7%82%BA%E5%AE%83%E4%B8%8D%E9%87%8D%E8%A6%81%E8%80%8C%E6%98%AF%E5%AE%83%E6%9C%AC%E4%BE%86%E5%B0%B1%E5%8F%AA%E6%98%AF%E7%B6%93%E9%81%8E-%E6%9B%BE%E7%B6%93%E4%BB%A5%E7%82%BA%E5%8F%AA%E8%A6%81%E5%8A%AA%E5%8A%9B%E5%B0%B1%E8%83%BD%E7%95%99%E4%BD%8F%E4%B8%80&amp;original_date=2025-08-02&amp;edit_status=draft&amp;body=%E6%9C%89%E4%BA%9B%E4%BA%8B%E4%B8%80%E9%96%8B%E5%A7%8B%E5%B0%B1%E8%A8%BB%E5%AE%9A%E6%9C%83%E6%B6%88%E5%A4%B1%E3%80%82%0A%E4%B8%8D%E6%98%AF%E5%9B%A0%E7%82%BA%E5%AE%83%E4%B8%8D%E9%87%8D%E8%A6%81%EF%BC%8C%E8%80%8C%E6%98%AF%E5%AE%83%E6%9C%AC%E4%BE%86%E5%B0%B1%E5%8F%AA%E6%98%AF%E7%B6%93%E9%81%8E%E3%80%82%0A%E6%9B%BE%E7%B6%93%E4%BB%A5%E7%82%BA%EF%BC%8C%E5%8F%AA%E8%A6%81%E5%8A%AA%E5%8A%9B%EF%BC%8C%E5%B0%B1%E8%83%BD%E7%95%99%

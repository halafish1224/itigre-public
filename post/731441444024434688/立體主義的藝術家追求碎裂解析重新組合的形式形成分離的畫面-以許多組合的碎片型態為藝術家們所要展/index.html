https://www.wikiart.org/zh/paintings-by-style/li-ti-zhu-yi#!#filterName:all-works,viewType:masonry
立體主義的藝術家追求碎裂、解析、重新組合的形式，形成分離的畫面──以許多組合的碎片型態為藝術家們所要展現的目標。藝術家以許多的角度來描寫對象物，將其置於同一個畫面之中，以此來表達對象物最為完整的形象。背景與畫面的主題交互穿插，讓立體主義的畫面創造出一個二度空間的繪畫特色。</div></article></main></body></html>

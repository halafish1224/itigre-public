為了旅程想說理解一些歷史故事，首次看了大河劇，原以為會過於嚴肅，沒想到劇情靈活，穿插笑點，觀感張弛有度。與一般日劇相比，大河劇節奏沉穩、角色層次豐富，情感處理上甚至覺得有點在看韓劇。看著看逐漸投入其中。音樂也令人驚艷，主題曲與配樂強化劇情張力很厲害。</div></article></main></body></html>

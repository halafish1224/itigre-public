彭佳慧《數著時間的日子》
小巨蛋場。
記錄一下當晚感受，覺得在許富凱登場以後整體唱功趨向穩定，開場時覺得嗓音喉嚨震動感較明顯的狀況幾乎好了，也確實更明白原來彭佳慧的歌唱太好，太難唱的都像普通歌一樣。
藉由演唱會認識深一點。
我愛了幾首歌

<a href="https://artemperor.tw/knowledge/81" data-astro-cid-5gfzogzi>https://artemperor.tw/knowledge/81</a>
二十世紀八零年代初期，在義大利出現了與德國新表現主義類似的流派，由義大利批評家阿基利‧博尼托‧奧利瓦(Achille Bonito Oliva)發起的，提出「超前衛派」這個名詞。他認為超前衛派是「對於過去所有的語言採取一種逆反的游牧態度」，也認為超前衛派的藝術家反對藝術品的非物質化和創作的非個人化，重新拾起手工的技巧，在創作中再度將繪畫的傳統呈現，以尋求超越。</div></article></main></body></html>

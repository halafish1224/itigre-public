</style></head><body data-astro-cid-5gfzogzi><main data-astro-cid-5gfzogzi><header data-astro-cid-5gfzogzi><a href="../../../" data-astro-cid-5gfzogzi>ITIGRE · 文章典藏</a></header><article data-astro-cid-5gfzogzi><h1 data-astro-cid-5gfzogzi>在臨桌聽到說話聲音腔調超像的人也是一種很奇妙的感覺來著！萬物...</h1><time datetime="2019-08-10" data-astro-cid-5gfzogzi>2019-08-10</time><div class="body" data-astro-cid-5gfzogzi>在臨桌聽到說話聲音腔調超像的人也是一種很奇妙的感覺來著！萬物頭蓋骨裡頭的聲音就是會有這麼相似的~
另一桌人客對星悅航空讚不絕口，有吃有喝有充電又新~跟老闆們熱烈討論北九州與解憂雜貨店，老闆娘對30公斤託運能帶很多日本書感到躍躍欲試！
本來想找流行點的地方喝咖啡吹冷氣看書，最後還是看店家沒人再度來了這裡，上次來已經好久好久以前了，沒想到人潮在一小時後湧現，讓店家的冷氣顯得不夠力了。（在 若草?咖啡館）

摘自 泉麻人「大東京23區散步」，頁91。</div><footer aria-label="原有標籤" data-astro-cid-5gfzogzi><p data-astro-cid-5gfzogzi><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#本光寺</span><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#大東京23區散步</span></p></footer></article><footer class="it-reading-end" data-astro-cid-5gfzogzi><a href="#article-top" data-astro-cid-5gfzogzi>回到頁首</a> · <a href="../../../reading-guide/" data-astro-cid-5gfzogzi>找下一篇文章</a></footer></main></body></html>

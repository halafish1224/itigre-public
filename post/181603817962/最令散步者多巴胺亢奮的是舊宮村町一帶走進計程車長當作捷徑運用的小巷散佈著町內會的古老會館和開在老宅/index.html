</style></head><body data-astro-cid-5gfzogzi><main data-astro-cid-5gfzogzi><header data-astro-cid-5gfzogzi><a href="../../../" data-astro-cid-5gfzogzi>ITIGRE · 文章典藏</a></header><article data-astro-cid-5gfzogzi><h1 data-astro-cid-5gfzogzi>最令散步者多巴胺亢奮的是舊宮村町一帶。走進計程車長當作捷徑運...</h1><time datetime="2019-01-01" data-astro-cid-5gfzogzi>2019-01-01</time><div class="body" data-astro-cid-5gfzogzi>最令散步者多巴胺亢奮的是舊宮村町一帶。走進計程車長當作捷徑運用的小巷，散佈著町內會的古老會館和開在老宅裡的酒館。從本光寺旁類似勇者鬥惡龍隱道的窄巷往深處走去，現在千住一帶都極罕見的古典平屋依舊屹立不搖。這一區就像畫中的窪地，相鄰而建的平屋背後，矗立著六本木之丘的高層大廈群，畫面衝擊很大。
摘自 泉麻人「大東京23區散步」，頁91。</div><footer aria-label="原有標籤" data-astro-cid-5gfzogzi><p data-astro-cid-5gfzogzi><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#本光寺</span><span style="display:inline-block;margin-right:.6rem;" data-astro-cid-5gfzogzi>#大東京23區散步</span></p></footer></article></main></body></html>

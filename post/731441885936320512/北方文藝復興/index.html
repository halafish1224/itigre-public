歐洲在十五世紀結束了長達千年的藝術以宗教目的為主，在“人文主義”思潮以及盛行於1380-1450年間歐洲的「國際哥德風格」的影響，往南發展到義大利，形成了義大利文藝復興；往北發展到當時的尼德蘭、法蘭西及日耳曼，則成為北方哥德式風格，進而演變為「北方文藝復興運動」</div></article></main></body></html>

說實在這是個感動的計畫（前3張照片）
利用3D列印做出人面孔特徵，再以錄音、模仿動作（應該也是有結合科技去做出多樣語句的模擬），然後陪伴你49天。
至親的離開很多可能是來不及道別的告別，這個計畫除了體現靈魂在人世最後的49天，更是讓在世的人哪，能有多那麼一點的時間，得以好好的與愛相別。

</style></head><body data-astro-cid-5gfzogzi><main data-astro-cid-5gfzogzi><header data-astro-cid-5gfzogzi>ITIGRE · 文章典藏</header><article data-astro-cid-5gfzogzi><h1 data-astro-cid-5gfzogzi>萬定，從水果行發跡，創業於大正3年，窗邊擺著昭和9年製的收銀...</h1><time datetime="2019-01-01" data-astro-cid-5gfzogzi>2019-01-01</time><div class="body" data-astro-cid-5gfzogzi>萬定，從水果行發跡，創業於大正3年，窗邊擺著昭和9年製的收銀機（金額單位還設定到角），現在仍在使用中。這裡的招牌餐點是咖哩飯和牛肉燴飯。黑滋滋的咖哩飯很像神保田町共榮堂的蘇門答臘咖哩，相傳有「吃了頭好壯壯，一定上東大」的說法。由於它是冰果室，鮮果汁也是絕品。
摘自 泉麻人「大東京23區散步」，頁130。
收銀機實打：https://photos.app.goo.gl/FUQeE3gapDs8cHsT6</div></article></main></body></html>

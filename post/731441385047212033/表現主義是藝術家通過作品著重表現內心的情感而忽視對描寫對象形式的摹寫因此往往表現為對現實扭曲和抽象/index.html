https://zh-yue.wikipedia.org/wiki/%E8%A1%A8%E7%8F%BE%E4%B8%BB%E7%BE%A9
表現主義是藝術家通過作品著重表現內心的情感，而忽視對描寫對象形式的摹寫，因此往往表現為對現實扭曲和抽象化。這個做法尤其用來表達恐懼的情感——歡快的表現主義作品很少見。</div></article></main></body></html>

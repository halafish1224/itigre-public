      (() => {
        if (window.__itigrePageCounterInitialized) return;
        window.__itigrePageCounterInitialized = true;
        const mountCounter = () => {
          if (document.querySelector('.itigre-page-counter')) return;
          const possibleLines = Array.from(document.querySelectorAll('hr, nav, header, section, article, footer, main > div'));
          const line = possibleLines.find(element => {
            if (element.tagName === 'HR') return true;
            const style = getComputedStyle(element);
            const rect = element.getBoundingClientRect();
            const hasBorder = (style.borderBottomStyle !== 'none' && parseFloat(style.borderBottomWidth) > 0)
              || (style.borderTopStyle !== 'none' && parseFloat(style.borderTopWidth) > 0);
            return hasBorder && rect.width >= 120;
          }) || document.querySelector('main') || document.body;
          if (!line || !line.parentNode) return;
          const slot = document.createElement('div');
          slot.className = 'itigre-page-counter-slot';
          const counter = document.createElement('div');
          counter.className = 'itigre-page-counter';
          counter.setAttribute('aria-label', '本頁瀏覽次數');
          const value = document.createElement('div');
          value.className = 'counterapi';
          value.setAttribute('ns', 'itigre.com');
          value.setAttribute('action', 'view');
          let pagePath = location.pathname || '/';
          try { pagePath = decodeURIComponent(pagePath); } catch (_) {}
          const segments = pagePath.split('/').filter(Boolean);
          const lastSegment = segments[segments.length - 1] || '';
          pagePath = segments.length ? '/' + segments.join('/') + (lastSegment.includes('.') ? '' : '/') : '/';
          const pageKey = pagePath === '/' ? 'home' : 'path-' + pagePath.split('/').filter(Boolean).join('--');
          value.setAttribute('key', pageKey);
          value.setAttribute('noIcon', 'true');
          value.setAttribute('noCss', 'true');
          value.setAttribute('noLink', 'true');
          value.setAttribute('noFormatting', 'true');
          counter.appendChild(value);
          const lineStyle = getComputedStyle(line);
          counter.style.color = lineStyle.color;
          slot.appendChild(counter);
          line.parentNode.insertBefore(slot, line.nextSibling);
          const library = document.createElement('script');
          library.src = 'https://counterapi.com/c.js?ns=itigre.com';
          library.async = true;
          document.head.appendChild(library);
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountCounter, { once: true });
        else mountCounter();
      })();

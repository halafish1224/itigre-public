backend:
  name: github
  repo: halafish1224/itigre-astro
  branch: main
  base_url: https://sveltia-cms-auth.halafish.workers.dev
  auth_methods:
    - oauth
    - token

field_defaults:
  richtext:
    modes: [rich_text, raw]
    editor_components: [code-block, image, table, hr]

app_title: ITIGRE 文章管理
site_url: https://itigre.com
display_url: https://itigre.com

publish_mode:
  type: preview
  direct_publish: true
  allow_incomplete_drafts: true

media_folder: public/images
public_folder: /images

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 75
        width: 1200
        height: 1200

collections:
  - name: posts_html
    label: 寫新文章
    label_singular: 文章
    folder: src/content/posts
    extension: md
    create: true
    delete: false
    filter: { field: editor_format, value: html }
    slug: { template: "{{title}}", editable: [create] }
    fields:
      - { name: editor_format, widget: hidden, default: html }
      - { name: title, label: 標題, widget: string, required: true }
      - name: body
        label: 正文
        widget: richtext
        format: html
        required: true
        sanitize_preview: true
        hint: 可切換視覺編輯、HTML 與即時預覽。含自訂樣式或嵌入內容時，請用 HTML 模式修改。
      - { name: cover_image, label: 封面圖片, widget: image, required: false }
      - name: gallery_images
        label: 文章照片（可一次選取多張）
        widget: image
        multiple: true
        required: false
        hint: 照片依此順序顯示在內文下方。手機用上移／下移，桌面可拖曳。在「瀏覽」可選擇 Cloudinary，或輸入現有圖片網址。
      - name: tags
        label: 標籤
        widget: list
        required: false
        hint: 可加東京、M2M 等標籤，也可以直接在正文寫 #東京。
      - name: publication_mode
        label: 發布方式
        widget: select
        default: now
        required: true
        options:
          - { label: 立即公開, value: now }
          - { label: 預約公開, value: scheduled }
          - { label: 草稿（不公開）, value: draft }
        hint: 選「儲存並發布」即可立即公開或完成預約。寫到一半可選草稿。
      - name: publish_at
        label: 預約時間（台灣時間）
        widget: datetime
        required: false
        input_timezone: Asia/Taipei
        output_utc: true
        step: 60
        hint: 選「預約公開」時填寫。
      - name: date
        label: 文章日期
        widget: datetime
        type: date
        default: '{{now}}'
        input_timezone: Asia/Taipei
        required: true
      - { name: summary, label: 摘要, widget: text, required: false }
      - { name: seo_title, label: SEO Title, widget: string, required: false }
      - { name: seo_description, label: Meta Description, widget: text, required: false }
      - name: seo_canonical
        label: Canonical
        widget: string
        required: false
        hint: 可留空。系統會使用本篇原始正式網址。
      - { name: og_title, label: 社群分享標題, widget: string, required: false }
      - { name: og_description, label: 社群分享摘要, widget: text, required: false }
      - { name: seo_image, label: 社群分享圖片, widget: image, required: false }

  - name: posts
    label: 既有文章（Markdown）
    folder: src/content/posts
    extension: md
    create: false
    filter: { field: editor_format, value: null }
    slug: { template: "{{title}}", editable: false }
    delete: false
    fields:
      - { name: editor_format, widget: hidden }
      - { name: title, label: 文章標題, widget: string, required: true }
      - name: body
        label: 正文
        widget: richtext
        required: true
        modes: [raw, rich_text]
        hint: 舊文預設以 Markdown 原始碼開啟。若有自訂 HTML、嵌入內容或原圖屬性，請用原始碼修改並預覽。
      - { name: cover_image, label: 封面圖片, widget: image, required: false }
      - name: gallery_images
        label: 文章照片（可一次選取多張）
        widget: image
        multiple: true
        required: false
        hint: 照片依此順序顯示在內文下方。手機用上移／下移，桌面可拖曳。在「瀏覽」可選擇 Cloudinary，或輸入現有圖片網址。
      - name: gallery
        label: 原有照片集與個別圖說
        widget: list
        required: false
        collapsed: true
        summary: '{{caption}}'
        thumbnail: image
        hint: "在此編輯原有照片、替代文字與圖說。批次加入的照片接續在原有照片之後。"
        fields:
          - { name: image, label: 照片, widget: image, required: true }
          - { name: alt, label: 圖片替代文字, widget: string, required: false }
          - { name: caption, label: 照片說明（選填）, widget: text, required: false }
      - name: tags
        label: 標籤（可輸入 #東京、#M2M 等）
        widget: list
        required: false
        field: { name: tag, label: 標籤, widget: string }
      - name: publication_mode
        label: 文章公開方式
        widget: select
        default: now
        required: true
        options:
          - { label: 立即公開, value: now }
          - { label: 預約公開, value: scheduled }
          - { label: 草稿（不公開）, value: draft }
        hint: "立即公開：儲存並發布後開始建置。預約公開：填寫下面的台灣時間後按「儲存並發布」完成預約，網站到期後才公開。草稿：選草稿並按「儲存」，保留編輯紀錄；即使誤按發布，草稿也不會出現在網站。"
      - name: publish_at
        label: 預約公開時間（台灣時間 UTC+8；僅預約公開時使用）
        widget: datetime
        required: false
        input_timezone: Asia/Taipei
        output_utc: true
        step: 60
        hint: "使用台灣時間設定預約。只在公開方式選「預約公開」時生效；預約卻未填時間會保持隱藏，請勿用文章日期代替。"
      - { name: date, label: 文章日期（頁面顯示用，不代表預約時間）, widget: datetime, required: true }
      - { name: summary, label: 文章摘要, widget: text, required: false }
      - name: category
        label: 文章分類
        widget: select
        required: false
        options:
          - 生活隨筆
          - 旅行紀錄
          - 音樂現場
          - 棒球紀實
          - 攝影筆記
          - 閱讀筆記
          - 知識整理
      - name: topics
        label: 主題
        widget: list
        required: false
        field: { name: topic, label: 主題, widget: string }
      - name: people
        label: 人物
        widget: list
        required: false
        field: { name: person, label: 人物, widget: string }
      - name: places
        label: 地點
        widget: list
        required: false
        field: { name: place, label: 地點, widget: string }
      - name: events
        label: 事件
        widget: list
        required: false
        field: { name: event, label: 事件, widget: string }
      - name: related_posts
        label: 人工指定相關文章 Slug（優先顯示）
        widget: list
        required: false
        field: { name: slug, label: CMS 文章 Slug, widget: string }
      - name: related_archive_paths
        label: 人工指定典藏文章路徑（優先顯示）
        widget: list
        required: false
        field: { name: path, label: 典藏路徑，例如 post/123/文章名稱, widget: string }
      - name: excluded_related_posts
        label: 排除 CMS 關聯文章 Slug
        widget: list
        required: false
        field: { name: slug, label: Slug, widget: string }
      - name: excluded_archive_paths
        label: 排除典藏文章路徑
        widget: list
        required: false
        field: { name: path, label: 典藏路徑, widget: string }
      - { name: cover_alt, label: 圖片替代文字, widget: string, required: false }
      - { name: cover_caption, label: 圖片說明, widget: string, required: false }
      - { name: seo_title, label: SEO Title, widget: string, required: false }
      - { name: seo_description, label: Meta Description, widget: text, required: false }
      - name: seo_canonical
        label: Canonical
        widget: string
        required: false
        hint: 可留空。系統會使用本篇原始正式網址。
      - { name: og_title, label: 社群分享標題, widget: string, required: false }
      - { name: og_description, label: 社群分享摘要, widget: text, required: false }
      - { name: seo_image, label: 社群分享圖片, widget: image, required: false }
      - { name: ai_review_summary, label: AI 查證提示摘要（僅供編輯參考）, widget: text, required: false }
      - { name: ai_review_checked_at, label: AI 最近分析時間, widget: datetime, required: false }
      - { name: ai_review_signature, label: AI 內容指紋（系統欄位）, widget: hidden }
      - name: ai_review_items
        label: AI 待確認項目（不是錯誤判定；不可直接公開）
        widget: list
        required: false
        summary: '{{review_type}} · {{claim}}'
        collapsed: true
        fields:
          - { name: claim, label: 原文中的待查證敘述, widget: text, required: true }
          - name: review_type
            label: 查證類型
            widget: select
            options:
              - { label: 日期／時間, value: date_or_timeline }
              - { label: 人物身分, value: person_or_identity }
              - { label: 地點／店家, value: place_or_business }
              - { label: 價格／營業資訊, value: price_or_hours }
              - { label: 賽事／事件結果, value: event_or_result }
              - { label: 歷史事實, value: historical_fact }
              - { label: 其他事實, value: other_fact }
          - { name: reason, label: 為何需要確認, widget: text, required: true }
          - { name: suggested_check, label: 建議查證方向, widget: text, required: false }
          - name: status
            label: 人工處理狀態
            widget: select
            default: pending_source
            options:
              - { label: 待找權威來源, value: pending_source }
              - { label: 待我確認, value: pending_user }
              - { label: 已核准（尚未公開）, value: approved }
              - { label: 退回重查, value: returned }
              - { label: 忽略, value: ignored }
          - name: evidence_level
            label: 證據等級
            widget: select
            default: none
            options:
              - { label: 尚無可靠來源, value: none }
              - { label: 一般來源／待交叉查證, value: limited }
              - { label: 官方或權威來源, value: authoritative }
              - { label: 多個權威來源一致, value: corroborated }
          - { name: source_label, label: 來源名稱（人工填寫）, widget: string, required: false }
          - { name: source_url, label: 來源網址（人工填寫）, widget: string, required: false }
          - { name: confidence, label: AI 判斷信心（不代表事實正確）, widget: string, required: false }
          - { name: reviewer_note, label: 人工判斷／修改意見, widget: text, required: false }

  - name: legacy_edits
    label: 舊文章修訂（草稿／公開）
    folder: src/content/legacy-edits
    extension: md
    slug: { template: "{{title}}", editable: [create] }
    create: true
    delete: false
    fields:
      - { name: title, label: 原文章標題, widget: string, required: true }
      - { name: original_path, label: 原始文章路徑（post/文章ID/slug）, widget: string, required: true }
      - { name: original_date, label: 原始發表日期, widget: datetime, required: false }
      - { name: edit_status, label: 網站顯示狀態（published 公開／draft 草稿）, widget: select, default: draft, options: [published, draft, reviewed], hint: "只有 published 的修訂內容會在網站部署後取代原文；draft 與 reviewed 保留原文顯示。" }
      - { name: edit_note, label: 修訂說明, widget: text, required: false }
      - { name: body, label: 修訂內容（原文請先保留；可以切換視覺／Markdown 編輯）, widget: markdown, required: true, modes: [raw, rich_text], hint: "保留舊文段落、圖片與原始網址，確認無誤再將狀態改成 published。含複雜 HTML 的原文請使用原始 Markdown 模式。" }

  - name: knowledge_notes
    label: 知識補充與更新
    folder: src/content/knowledge-notes
    extension: md
    create: true
    delete: false
    fields:
      - { name: title, label: 補充標題, widget: string, required: true }
      - name: target_type
        label: 關聯文章類型
        widget: select
        options:
          - { label: 新 CMS 文章, value: new }
          - { label: 舊典藏文章, value: archive }
      - { name: target_slug, label: 新文章 Slug（新 CMS 文章使用）, widget: string, required: false }
      - { name: target_path, label: 典藏文章路徑（舊文章使用）, widget: string, required: false }
      - name: kind
        label: 補充類型
        widget: select
        options:
          - { label: 背景知識, value: background }
          - { label: 後續更新, value: update }
          - { label: 補充說明, value: clarification }
      - { name: checked_at, label: 查證日期, widget: datetime, required: false }
      - name: status
        label: 查證狀態
        widget: select
        default: draft
        options:
          - { label: 草稿, value: draft }
          - { label: 待查證, value: needs_review }
          - { label: 已核實（經站主核准後公開）, value: verified }
      - { name: source_label, label: 資料來源名稱, widget: string, required: false }
      - { name: source_url, label: 資料來源網址, widget: string, required: false }
      - { name: body, label: 補充內容, widget: richtext, required: true }

  - name: review_inbox
    label: 待人工確認｜Review Inbox
    folder: src/content/review-inbox
    extension: md
    create: true
    delete: false
    publish: false
    summary: '{{title}} · {{review_type}} · {{status}}'
    fields:
      - { name: title, label: 待確認事項標題, widget: string, required: true }
      - name: target_type
        label: 原文章類型
        widget: select
        options:
          - { label: 新 CMS 文章, value: new }
          - { label: 舊典藏文章, value: archive }
      - { name: target_slug, label: 原文章 Slug（新文章）, widget: string, required: false }
      - { name: target_path, label: 原文章典藏路徑（舊文章）, widget: string, required: false }
      - name: review_type
        label: 確認原因
        widget: select
        options:
          - { label: 缺少權威來源, value: source_needed }
          - { label: 資料互相矛盾, value: conflicting_info }
          - { label: AI 推論／解讀, value: ai_inference }
          - { label: 等待人工核准, value: approval_needed }
          - { label: 原文可能有誤, value: possible_correction }
      - name: status
        label: 處理狀態
        widget: select
        default: pending_user
        options:
          - { label: 待找來源, value: pending_source }
          - { label: 待你確認, value: pending_user }
          - { label: 已核准（尚未公開）, value: approved }
          - { label: 已退回重查, value: returned }
          - { label: 已忽略, value: ignored }
      - { name: ai_summary, label: AI 發現與原因, widget: text, required: true }
      - { name: proposed_content, label: AI 建議補充內容（不會自動公開）, widget: text, required: false }
      - { name: source_label, label: 來源名稱, widget: string, required: false }
      - { name: source_url, label: 來源網址, widget: string, required: false }
      - { name: checked_at, label: 查證日期, widget: datetime, required: false }
      - name: evidence_level
        label: 證據等級
        widget: select
        options:
          - { label: 尚無可靠來源, value: none }
          - { label: 一般來源／待交叉查證, value: limited }
          - { label: 官方或權威來源, value: authoritative }
          - { label: 多個權威來源一致, value: corroborated }
      - { name: confidence, label: AI 信心說明（僅供參考）, widget: string, required: false }
      - { name: reviewer_note, label: 你的判斷／修改意見, widget: text, required: false }
      - { name: decision_at, label: 人工決定日期, widget: datetime, required: false }
      - { name: linked_note_slug, label: 核准後建立的 Knowledge Note Slug, widget: string, required: false }
      - { name: original_preservation, label: 原文保護規則, widget: hidden, default: preserve }

  - name: site_settings
    label: 首頁與網站設定
    files:
      - name: home
        label: 首頁設定
        file: src/content/site-settings/home.json
        format: json
        fields:
          - { name: title, label: 首頁主標題（H1）, widget: string, required: false }
          - { name: intro, label: 首頁介紹, widget: text, required: false }
          - { name: intro_detail, label: 介紹補充, widget: text, required: false }
          - { name: hero_image, label: 首頁主視覺, widget: image, required: false }
          - { name: hero_alt, label: 主視覺替代文字, widget: string, required: false }
          - name: featured
            label: 精選文章（依清單順序）
            widget: list
            required: false
            summary: '{{path}}'
            hint: 新文章可搜尋標題。典藏與整理記事使用已公開的站內路徑。
            fields:
              - { name: post, label: CMS 新文章, widget: relation, collection: posts_html, search_fields: [title, '{{slug}}'], value_field: '{{slug}}', display_fields: [title], required: false }
              - { name: path, label: 站內文章路徑, widget: string, required: false }
          - name: sections
            label: 首頁區塊（依清單順序）
            widget: list
            required: false
            summary: '{{section}}'
            hint: 未列出的區塊沿用預設順序及顯示狀態，並排在所選區塊後方。取消顯示即可隱藏。
            fields:
              - name: section
                label: 區塊
                widget: select
                options:
                  - { label: 三商虎專題, value: tigers_feature }
                  - { label: 典藏介紹, value: archive_intro }
                  - { label: 虎衣策展, value: tigers_curation }
                  - { label: 精選文章, value: featured }
                  - { label: 最新文章, value: latest }
                  - { label: 找故事導覽, value: archive_browser }
              - { name: visible, label: 顯示, widget: boolean, default: true }
          - name: navigation
            label: 首頁導覽選單
            widget: list
            required: false
            summary: '{{label}}'
            hint: 請輸入以 / 開頭的站內路徑，例如 /reading-guide/#travel。
            fields:
              - { name: label, label: 選單文字, widget: string }
              - { name: detail, label: 小字, widget: string, required: false }
              - { name: url, label: 站內路徑, widget: string, pattern: ['^/(?!/).*$', 請輸入站內路徑] }

      - name: seo
        label: SEO／GEO 設定
        file: src/content/site-settings/seo.json
        format: json
        fields:
          - { name: site_name, label: 網站名稱, widget: string, required: false }
          - { name: site_description, label: 網站主題與描述, widget: text, required: false }
          - { name: author_name, label: 作者名稱, widget: string, required: false }
          - { name: author_url, label: 作者介紹頁網址, widget: string, required: false }
          - { name: site_image, label: 網站預設社群分享圖片, widget: image, required: false }
          - name: home
            label: 首頁 SEO 與社群
            widget: object
            required: false
            fields:
              - { name: seo_title, label: 首頁 SEO Title, widget: string, required: false }
              - { name: seo_description, label: 首頁 Meta Description, widget: text, required: false }
              - { name: seo_canonical, label: 首頁 Canonical, widget: string, required: false, hint: 可留空。系統會使用正式首頁網址。 }
              - { name: og_title, label: 首頁社群分享標題, widget: string, required: false }
              - { name: og_description, label: 首頁社群分享摘要, widget: text, required: false }
              - { name: seo_image, label: 首頁社群分享圖片, widget: image, required: false }

name: Test D1 reading counter

on:
  pull_request:
    paths:
      - '.github/reading-counter-worker/**'
      - 'styles/reading-counter.js'
      - '.github/scripts/inject-reading-counter.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/reading-counter-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify syntax
        run: |
          node --version
          node --check .github/reading-counter-worker/src/index.js
          node --check styles/reading-counter.js
          node --check .github/scripts/inject-reading-counter.mjs
      - name: Test Worker and injector
        run: node --test .github/reading-counter-worker/test/*.test.mjs

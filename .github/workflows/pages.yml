name: Deploy ITIGRE to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Attach reading counter to public pages
        env:
          ITIGRE_READING_COUNTER_ENDPOINT: ${{ vars.ITIGRE_READING_COUNTER_ENDPOINT || 'https://count.getloli.com/record/@itigre-' }}
          ITIGRE_READING_COUNTER_D1_ENDPOINT: ${{ vars.ITIGRE_READING_COUNTER_MODE != 'legacy' && (vars.ITIGRE_READING_COUNTER_D1_ENDPOINT || 'https://itigre-reading-counter.halafish.workers.dev/v1/count') || '' }}
        run: node .github/scripts/inject-reading-counter.mjs
      - name: Package static site for Pages
        run: |
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\")] | length")"
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
